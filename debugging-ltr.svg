<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <style>
    @font-face {
      font-family: "JBM";
      font-weight: 400;
      src: url(data:font/woff;base64,) format("woff");
    }
    text { font-family: "JBM", "JetBrains Mono", Consolas, monospace; font-weight: 400; text-anchor: middle; }
    /* letters ignite one by one, left to right, like neon tubes, then erases letter by letter. 5s loop */
    .letter { font-size: 104px; opacity: 0; filter: url(#glow);
              animation: type1 5s steps(1, end) infinite both; }
    @keyframes type1 {
      0% { opacity: 0; }
      0.6% { opacity: 1; }
      1.6% { opacity: 0; }
      3.2% { opacity: 0.8; }
      3.8% { opacity: 0; }
      4.6% { opacity: 1; }
      5.4% { opacity: 0.35; }
      5.8% { opacity: 1; }
      70% { opacity: 1; animation-timing-function: linear; }
      72% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes type2 {
      0% { opacity: 0; }
      3% { opacity: 0; }
      3.6% { opacity: 1; }
      4.6% { opacity: 0; }
      6.2% { opacity: 0.8; }
      6.8% { opacity: 0; }
      7.6% { opacity: 1; }
      8.4% { opacity: 0.35; }
      8.8% { opacity: 1; }
      73% { opacity: 1; animation-timing-function: linear; }
      75% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes type3 {
      0% { opacity: 0; }
      6% { opacity: 0; }
      6.6% { opacity: 1; }
      7.6% { opacity: 0; }
      9.2% { opacity: 0.8; }
      9.8% { opacity: 0; }
      10.6% { opacity: 1; }
      11.4% { opacity: 0.35; }
      11.8% { opacity: 1; }
      76% { opacity: 1; animation-timing-function: linear; }
      78% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes type4 {
      0% { opacity: 0; }
      9% { opacity: 0; }
      9.6% { opacity: 1; }
      10.6% { opacity: 0; }
      12.2% { opacity: 0.8; }
      12.8% { opacity: 0; }
      13.6% { opacity: 1; }
      14.4% { opacity: 0.35; }
      14.8% { opacity: 1; }
      17% { opacity: 0.2; }
      17.6% { opacity: 1; }
      18.4% { opacity: 0.3; }
      18.8% { opacity: 1; }
      79% { opacity: 1; animation-timing-function: linear; }
      81% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes type5 {
      0% { opacity: 0; }
      12% { opacity: 0; }
      12.6% { opacity: 1; }
      13.6% { opacity: 0; }
      15.2% { opacity: 0.8; }
      15.8% { opacity: 0; }
      16.6% { opacity: 1; }
      17.4% { opacity: 0.35; }
      17.8% { opacity: 1; }
      82% { opacity: 1; animation-timing-function: linear; }
      84% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes type6 {
      0% { opacity: 0; }
      15% { opacity: 0; }
      15.6% { opacity: 1; }
      16.6% { opacity: 0; }
      18.2% { opacity: 0.8; }
      18.8% { opacity: 0; }
      19.6% { opacity: 1; }
      20.4% { opacity: 0.35; }
      20.8% { opacity: 1; }
      85% { opacity: 1; animation-timing-function: linear; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes type7 {
      0% { opacity: 0; }
      18% { opacity: 0; }
      18.6% { opacity: 1; }
      19.6% { opacity: 0; }
      21.2% { opacity: 0.8; }
      21.8% { opacity: 0; }
      22.6% { opacity: 1; }
      23.4% { opacity: 0.35; }
      23.8% { opacity: 1; }
      88% { opacity: 1; animation-timing-function: linear; }
      90% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes type8 {
      0% { opacity: 0; }
      21% { opacity: 0; }
      21.6% { opacity: 1; }
      22.6% { opacity: 0; }
      24.2% { opacity: 0.8; }
      24.8% { opacity: 0; }
      25.6% { opacity: 1; }
      26.4% { opacity: 0.35; }
      26.8% { opacity: 1; }
      29% { opacity: 0.2; }
      29.6% { opacity: 1; }
      30.4% { opacity: 0.3; }
      30.8% { opacity: 1; }
      91% { opacity: 1; animation-timing-function: linear; }
      93% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes type9 {
      0% { opacity: 0; }
      24% { opacity: 0; }
      24.6% { opacity: 1; }
      25.6% { opacity: 0; }
      27.2% { opacity: 0.8; }
      27.8% { opacity: 0; }
      28.6% { opacity: 1; }
      29.4% { opacity: 0.35; }
      29.8% { opacity: 1; }
      94% { opacity: 1; animation-timing-function: linear; }
      96% { opacity: 0; }
      100% { opacity: 0; }
    }
    .cursor { fill: #bdbdbd; filter: url(#glow); animation: blink 1s linear infinite; }
    @keyframes blink {
      0%   { opacity: 1; }
      50%  { opacity: 1; }
      51%  { opacity: 0; }
      100% { opacity: 0; }
    }
    /* tagline fades in after the word is typed and fades out as the word erases, on the same 5s loop */
    .tagline { font-size: 24px; letter-spacing: 1px; fill: #6e7681; opacity: 0; animation: fade 5s ease-in-out 1.60s infinite both; }
    @keyframes fade {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      58%  { opacity: 1; }
      66%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .l1 { fill: #ececec; animation-name: type1; }
    .l2 { fill: #dadada; animation-name: type2; }
    .l3 { fill: #c8c8c8; animation-name: type3; }
    .l4 { fill: #b5b5b5; animation-name: type4; }
    .l5 { fill: #a3a3a3; animation-name: type5; }
    .l6 { fill: #919191; animation-name: type6; }
    .l7 { fill: #7f7f7f; animation-name: type7; }
    .l8 { fill: #6c6c6c; animation-name: type8; }
    .l9 { fill: #5a5a5a; animation-name: type9; }
  </style>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="tight"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="#0d1117"/>

  <text class="letter l1" x="178" y="110">D</text>
  <text class="letter l2" x="246" y="110">E</text>
  <text class="letter l3" x="314" y="110">B</text>
  <text class="letter l4" x="382" y="110">U</text>
  <text class="letter l5" x="450" y="110">G</text>
  <text class="letter l6" x="518" y="110">G</text>
  <text class="letter l7" x="586" y="110">I</text>
  <text class="letter l8" x="654" y="110">N</text>
  <text class="letter l9" x="722" y="110">G</text>
  <rect class="cursor" x="762" y="112" width="56" height="8"/>

  <text class="tagline" x="450" y="164">backend · SRE · distributed systems</text>
</svg>
