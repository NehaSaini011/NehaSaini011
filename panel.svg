<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <style>
    @font-face { font-family: "JBM"; font-weight: 400; src: url(data:font/woff;base64,) format("woff"); }
    @font-face { font-family: "JBM"; font-weight: 700; src: url(data:font/woff;base64,) format("woff"); }
    text { font-family: "JBM", "JetBrains Mono", ui-monospace, Consolas, monospace; }
    .name { font-size: 34px; font-weight: 700; fill: #e6edf3; }
    .sub  { font-size: 16px; fill: #9198a1; }
    .lab  { font-size: 13px; letter-spacing: 2px; fill: #6e7681; }
    .val  { font-size: 17px; fill: #e6edf3; }
    .dim  { fill: #9198a1; }
    .st   { font-size: 14px; text-anchor: end; }
    .row  { opacity: 0; animation: rise 0.45s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .ring { animation: ping 1.8s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2.6); opacity: 0; } }
  </style>
  <rect width="900" height="450" fill="#0d1117"/>
  <text class="name" x="44" y="70">Neha Saini</text>
  <text class="sub" x="44" y="100">Kubernetes contributor · SIG Node · SIG Release</text>
  <line x1="44" y1="128" x2="856" y2="128" stroke="#30363d"/>
    <g class="row" style="animation-delay:0.15s">
    <text class="lab" x="44" y="176">NOW</text>
    <text class="val" x="250" y="176">Debugging kubernetes#141036<tspan class="dim"> · arm64 CI flake</tspan></text>
    <circle cx="749.6" cy="171" r="4.5" fill="#d29922"/>
    <circle class="ring" cx="749.6" cy="171" r="4.5" fill="none" stroke="#d29922" stroke-width="1.5" style="transform-origin:749.6px 171px"/>
    <text class="st" x="856" y="176" fill="#d29922">in progress</text>
    </g>
  <line x1="44" y1="196" x2="856" y2="196" stroke="#21262d"/>
  <g class="row" style="animation-delay:0.23s">
    <text class="lab" x="44" y="222">MERGED</text>
    <text class="val" x="250" y="222">kubernetes/community#9083<tspan class="dim"> · apache/maven</tspan></text>
    <circle cx="791.6" cy="217" r="4.5" fill="#3fb950"/>
    <text class="st" x="856" y="222" fill="#3fb950">merged</text>
    </g>
  <line x1="44" y1="242" x2="856" y2="242" stroke="#21262d"/>
  <g class="row" style="animation-delay:0.31s">
    <text class="lab" x="44" y="268">RECOGNITION</text>
    <text class="val" x="250" y="268">Smart India Hackathon 2025<tspan class="dim"> · National Finalist</tspan></text>
    </g>
  <line x1="44" y1="288" x2="856" y2="288" stroke="#21262d"/>
  <g class="row" style="animation-delay:0.39s">
    <text class="lab" x="44" y="314">STACK</text>
    <text class="val" x="250" y="314">Java · Go · Spring Boot · PostgreSQL · Kubernetes · Linux<tspan class="dim"></tspan></text>
    </g>
  <line x1="44" y1="334" x2="856" y2="334" stroke="#21262d"/>
  <g class="row" style="animation-delay:0.47s">
    <text class="lab" x="44" y="360">EDUCATION</text>
    <text class="val" x="250" y="360">B.Tech IT · IGDTUW<tspan class="dim"> · 2028</tspan></text>
    </g>
  <line x1="44" y1="380" x2="856" y2="380" stroke="#21262d"/>
  <g class="row" style="animation-delay:0.55s">
    <text class="lab" x="44" y="406">OPEN TO</text>
    <text class="val" x="250" y="406">Backend / SRE internships<tspan class="dim"></tspan></text>
    </g>
</svg>
